name: CI/CD Heavy Metal Rock TV - Production Engine

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      # 1. Validación Semántica Estricta de Esquema (Python 3)
      - name: Validar Integridad Estructural de products.json
        run: |
          python3 -c "
          import json, sys

          REQUIRED_FIELDS = {'id', 'nombre', 'categoria', 'banda', 'descripcion', 'precio', 'imagen'}
          ALLOWED_CATEGORIES = {'polos', 'casacas', 'poleras', 'pantalones', 'calzado', 'mochilas', 'accesorios', 'posters', 'vinilos'}

          try:
              with open('data/products.json', 'r', encoding='utf-8') as f:
                  data = json.load(f)
              
              if not isinstance(data, list):
                  sys.exit('FATAL: data/products.json debe ser un array de objetos.')

              if len(data) == 0:
                  sys.exit('FATAL: El catálogo no puede estar vacío.')

              seen_ids = set()
              for idx, item in enumerate(data):
                  missing = REQUIRED_FIELDS - set(item.keys())
                  if missing:
                      sys.exit(f'FATAL en índice {idx}: Faltan campos requeridos {missing}')

                  item_id = str(item['id']).strip()
                  if not item_id:
                      sys.exit(f'FATAL en índice {idx}: ID no puede estar vacío.')
                  if item_id in seen_ids:
                      sys.exit(f'FATAL: ID duplicado detectado: \"{item_id}\" en índice {idx}')
                  seen_ids.add(item_id)

                  cat = str(item['categoria']).strip().lower()
                  if cat not in ALLOWED_CATEGORIES:
                      sys.exit(f'FATAL en ID \"{item_id}\": Categoría \"{cat}\" inválida. Permitidas: {ALLOWED_CATEGORIES}')

                  if not str(item['nombre']).strip():
                      sys.exit(f'FATAL en ID \"{item_id}\": El campo \"nombre\" no puede estar vacío.')

              print(f'Validación superada con éxito: {len(data)} reliquias auditadas sin inconsistencias. ❄️')
          except Exception as err:
              sys.exit(f'CRITICAL FAILURE: {err}')
          "

      # 2. Minificación Total de Assets (HTML, CSS, JS) en Main
      - name: Configurar Node.js y Minificar Assets
        if: github.ref == 'refs/heads/main'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Minificar Todo el Árbol Estático
        if: github.ref == 'refs/heads/main'
        run: |
          # Minificar todos los scripts JS (incluyendo store.js, menu.js y sw.js)
          npx terser js/menu.js -c -m -o js/menu.js || true
          npx terser js/store.js -c -m -o js/store.js || true
          if [ -f "sw.js" ]; then
            npx terser sw.js -c -m -o sw.js
          fi

          # Minificar CSS centralizado
          if [ -f "css/style.css" ]; then
            npx csso-cli css/style.css -o css/style.css
          fi

          # Minificar todas las vistas HTML
          for file in *.html; do
            if [ -f "$file" ]; then
              npx html-minifier-terser \
                --collapse-whitespace \
                --remove-comments \
                --remove-redundant-attributes \
                --remove-script-type-attributes \
                --remove-style-link-type-attributes \
                --minify-css true \
                --minify-js true \
                -o "$file" "$file"
            fi
          done

      - name: Configurar GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v4

      - name: Preparar artefactos para despliegue
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: validate-and-build
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4