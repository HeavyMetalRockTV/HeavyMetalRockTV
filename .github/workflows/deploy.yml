name: CI/CD Heavy Metal Rock TV

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Validar integridad de JSON
        run: |
          echo "Verificando estructura de data/products.json..."
          python3 -m json.tool data/products.json > /dev/null
          echo "¡El archivo JSON es 100% valido!"

      - name: Configurar Node.js y Minificar Assets
        if: github.ref == 'refs/heads/main'
        run: |
          npm install -g html-minifier-terser terser csso-cli
          
          # Minificar JavaScript global
          if [ -f "js/menu.js" ]; then
            terser js/menu.js -c -m -o js/menu.min.js
            mv js/menu.min.js js/menu.js
          fi

          # Minificar archivos HTML (incluye CSS y JS embebido)
          for file in *.html; do
            if [ -f "$file" ]; then
              html-minifier-terser \
                --collapse-whitespace \
                --remove-comments \
                --remove-redundant-attributes \
                --remove-script-type-attributes \
                --remove-style-link-type-attributes \
                --minify-css true \
                --minify-js true \
                -o "$file" "$file"
            fi
          done

      - name: Configurar GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v4

      - name: Preparar artefactos para despliegue
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: validate-and-build
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4