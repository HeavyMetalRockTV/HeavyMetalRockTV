<!DOCTYPE html>
<html lang="es">

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Heavy Metal Store - Tienda Oficial</title>
    <link rel="icon" href="img/estetica/HMR_recortada.ico">
    <link rel="stylesheet" href="bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="fonts/style.css">
    <style>
        :root {
            --accent-red: #d32f2f;
            --accent-gold: #c5a059;
            --dark-card: rgba(14, 14, 14, 0.92);
            --border-metal: #2a2a2a;
        }

        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            margin: 0;
            padding: 0;
            color: #e0e0e0;
            background-color: #080808;
            background-image: linear-gradient(rgba(0, 0, 0, 0.78), rgba(0, 0, 0, 0.88)), url('img/estetica/diogustavo.jpg');
            background-attachment: fixed;
            background-size: cover;
            background-position: center;
            display: flex;
            min-height: 100vh;
        }

        /* Menú lateral estilo consola profesional */
        nav {
            background: linear-gradient(180deg, #0d0d0d 0%, #050505 100%);
            width: 250px;
            height: 100vh;
            position: fixed;
            left: 0;
            top: 0;
            display: flex;
            flex-direction: column;
            padding: 25px 15px 15px 15px;
            border-right: 2px solid #222;
            border-image: linear-gradient(to bottom, #d32f2f, #333 35%, #111 80%, #d32f2f) 1;
            box-shadow: 5px 0 25px rgba(0, 0, 0, 0.9), 2px 0 10px rgba(211, 47, 47, 0.15);
            z-index: 100;
            box-sizing: border-box;
        }

        nav .brand-container {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 25px;
            padding-bottom: 18px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        nav .brand-container a {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            background: transparent !important;
            border: none !important;
            padding: 0 !important;
            margin: 0 !important;
        }

        nav img#HMRTV {
            display: block;
            width: auto;
            max-width: 180px;
            height: auto;
            margin: 0 auto;
            transition: transform 0.3s ease, filter 0.3s ease;
            filter: drop-shadow(0 0 8px rgba(211, 47, 47, 0.35));
        }

        nav img#HMRTV:hover {
            transform: scale(1.05);
            filter: drop-shadow(0 0 14px rgba(211, 47, 47, 0.7));
        }

        .nav-links {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        nav a {
            text-decoration: none;
            color: #9e9e9e;
            font-weight: 700;
            font-size: 13px;
            padding: 12px 16px;
            border-radius: 6px;
            border-left: 3px solid transparent;
            background: rgba(255, 255, 255, 0.02);
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        nav a .nav-icon {
            font-size: 16px;
            width: 20px;
            text-align: center;
            color: #666;
            transition: color 0.25s ease;
        }

        nav a:hover {
            color: #fff;
            background: rgba(211, 47, 47, 0.12);
            border-left: 3px solid var(--accent-red);
            padding-left: 20px;
        }

        nav a:hover .nav-icon {
            color: var(--accent-red);
        }

        nav a.active {
            color: #fff;
            background: linear-gradient(90deg, rgba(211, 47, 47, 0.25) 0%, rgba(211, 47, 47, 0.05) 100%);
            border-left: 3px solid var(--accent-red);
            box-shadow: inset 0 0 10px rgba(211, 47, 47, 0.1);
        }

        nav a.active .nav-icon {
            color: var(--accent-red);
        }

        .radio-status-card {
            margin-top: 25px;
            background: rgba(20, 20, 20, 0.8);
            border: 1px solid #1f1f1f;
            border-radius: 6px;
            padding: 12px 14px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .pulse-live {
            width: 10px;
            height: 10px;
            background-color: #e50914;
            border-radius: 50%;
            box-shadow: 0 0 0 0 rgba(229, 9, 20, 0.7);
            animation: live-pulse 1.8s infinite;
        }

        @keyframes live-pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(229, 9, 20, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 8px rgba(229, 9, 20, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(229, 9, 20, 0); }
        }

        .radio-status-text {
            display: flex;
            flex-direction: column;
        }

        .radio-status-text .title {
            font-size: 11px;
            font-weight: 800;
            color: #fff;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .radio-status-text .sub {
            font-size: 10px;
            color: #777;
        }

        .nav-footer {
            margin-top: auto;
            padding-top: 15px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            text-align: center;
        }

        .nav-socials {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 12px;
        }

        .nav-socials a {
            width: 32px;
            height: 32px;
            padding: 0;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
            background: #141414;
            border: 1px solid #222;
            color: #888;
            font-size: 13px;
            transition: all 0.2s ease;
        }

        .nav-socials a:hover {
            background: var(--accent-red);
            color: #fff;
            border-color: var(--accent-red);
            box-shadow: 0 0 8px rgba(211, 47, 47, 0.5);
            padding-left: 0;
        }

        .nav-copy {
            font-size: 10px;
            color: #555;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        /* Área central */
        main {
            margin-left: 250px;
            flex: 1;
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        section {
            width: 100%;
            max-width: 1250px;
            background: var(--dark-card);
            border: 1px solid var(--border-metal);
            border-radius: 8px;
            padding: 35px 40px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            box-sizing: border-box;
        }

        h1 {
            color: #fff;
            font-size: 1.8rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            border-bottom: 2px solid var(--accent-red);
            padding-bottom: 12px;
            margin-top: 0;
            margin-bottom: 25px;
        }

        /* Logo de tienda maximizado */
        .logo-tienda-container {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 15px 0 30px 0;
        }

        .logo-tienda {
            max-width: 900px;
            width: 100%;
            height: auto;
            max-height: 320px;
            display: block;
            object-fit: contain;
            filter: drop-shadow(0 0 20px rgba(211, 47, 47, 0.55));
            transition: transform 0.3s ease, filter 0.3s ease;
        }

        .logo-tienda:hover {
            transform: scale(1.02);
            filter: drop-shadow(0 0 28px rgba(211, 47, 47, 0.85));
        }

        /* Controles de Tienda (Filtros y Buscador) */
        .store-controls {
            background: rgba(20, 20, 20, 0.7);
            border: 1px solid #282828;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 35px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .search-bar-wrapper input {
            width: 100%;
            background: #0d0d0d;
            border: 1px solid #333;
            border-radius: 6px;
            padding: 12px 18px;
            color: #fff;
            font-size: 14px;
            outline: none;
            box-sizing: border-box;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .search-bar-wrapper input:focus {
            border-color: var(--accent-red);
            box-shadow: 0 0 10px rgba(211, 47, 47, 0.35);
        }

        .filter-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .filter-btn {
            background: #181818;
            color: #aaa;
            border: 1px solid #333;
            padding: 8px 16px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .filter-btn:hover {
            color: #fff;
            border-color: #555;
            background: #252525;
        }

        .filter-btn.active {
            background: var(--accent-red);
            color: #fff;
            border-color: var(--accent-red);
            box-shadow: 0 0 10px rgba(211, 47, 47, 0.5);
        }

        /* Grilla simétrica de 3 columnas */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 28px;
        }

        .product-card {
            background: rgba(18, 18, 18, 0.9);
            border: 1px solid #282828;
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.3s cubic-bezier(0.25, 0.8, 0.25, 1), border-color 0.3s ease, box-shadow 0.3s ease;
        }

        .product-card:hover {
            transform: translateY(-6px);
            border-color: var(--accent-red);
            box-shadow: 0 10px 28px rgba(211, 47, 47, 0.35);
        }

        .product-card-img-wrapper {
            width: 100%;
            height: 260px;
            background: #050505;
            overflow: hidden;
            position: relative;
            cursor: pointer;
            border-bottom: 1px solid #222;
        }

        .product-card-img-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s ease;
        }

        .product-card:hover .product-card-img-wrapper img {
            transform: scale(1.07);
        }

        .badge-category {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.85);
            border: 1px solid var(--accent-red);
            color: #fff;
            font-size: 10px;
            font-weight: 800;
            padding: 4px 10px;
            border-radius: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .product-card-body {
            padding: 20px 18px;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .product-card-body h3 {
            font-size: 1.1rem;
            font-weight: 700;
            color: #fff;
            margin: 0 0 6px 0;
            text-transform: uppercase;
        }

        .product-band {
            font-size: 12px;
            font-weight: 700;
            color: var(--accent-gold);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .product-desc {
            font-size: 13px;
            line-height: 1.5;
            color: #8e8e8e;
            margin: 0 0 15px 0;
        }

        .product-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-top: 1px solid #222;
            padding-top: 15px;
            margin-top: auto;
        }

        .product-price {
            font-size: 1.15rem;
            font-weight: 800;
            color: #fff;
        }

        .btn-order {
            background: linear-gradient(180deg, #25d366 0%, #128c7e 100%);
            color: #fff;
            padding: 10px 18px;
            font-size: 12px;
            font-weight: 800;
            border-radius: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            text-decoration: none;
            border: 1px solid #25d366;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-order:hover {
            background: linear-gradient(180deg, #2bf075 0%, #15a392 100%);
            color: #fff;
            box-shadow: 0 0 12px rgba(37, 211, 102, 0.6);
            transform: scale(1.03);
        }

        /* Modal Lightbox */
        .lightbox-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(8px);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .lightbox-modal.active { display: flex; opacity: 1; }

        .lightbox-content {
            max-width: 90vw;
            max-height: 88vh;
            border-radius: 8px;
            border: 2px solid var(--accent-red);
            box-shadow: 0 0 35px rgba(211, 47, 47, 0.5);
            object-fit: contain;
        }

        .lightbox-close {
            position: absolute;
            top: 25px;
            right: 35px;
            color: #fff;
            font-size: 40px;
            font-weight: bold;
            cursor: pointer;
        }

        .lightbox-close:hover { color: var(--accent-red); }

        .lightbox-caption {
            position: absolute;
            bottom: 20px;
            color: #bbb;
            font-size: 15px;
            text-transform: uppercase;
            font-weight: 700;
        }

        /* Responsividad */
        @media screen and (max-width: 1100px) {
            .product-grid { grid-template-columns: repeat(2, 1fr); }
        }

        @media screen and (max-width: 992px) {
            body { flex-direction: column; }
            nav { position: relative; width: 100%; height: auto; }
            main { margin-left: 0; padding: 15px; }
            .logo-tienda { max-width: 95%; }
        }

        @media screen and (max-width: 650px) {
            .product-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>

        let activeCategory = 'todos';

        // Configuración de contacto
        const WHATSAPP_PHONE = "51"; // Reemplaza con el número real de WhatsApp (ej: 51987654321)

        // Renderizar los productos en la grilla
        function renderProducts(products) {
            const container = document.getElementById('productsContainer');
            container.innerHTML = '';

            if (products.length === 0) {
                container.innerHTML = `<div style="grid-column: 1 / -1; text-align: center; padding: 40px; color: #777;">
                    <h3>No se encontraron productos para esta búsqueda 💀</h3>
                </div>`;
                return;
            }

            products.forEach(p => {
                // Mensaje estructurado para WhatsApp
                const msg = `¡Hola Heavy Metal Store! 🤘 Deseo pedir el siguiente producto:\n\n` +
                            `📦 *Producto:* ${p.nombre}\n` +
                            `🎸 *Banda:* ${p.banda}\n` +
                            `💰 *Precio:* ${p.precio}\n\n` +
                            `¿Tienen stock y disponible en mi talla?`;
                
                const whatsappUrl = `https://wa.me/${WHATSAPP_PHONE}?text=${encodeURIComponent(msg)}`;

                const card = document.createElement('div');
                card.className = 'product-card';
                card.innerHTML = `
                    <div class="product-card-img-wrapper" onclick="openLightbox('${p.imagen}', '${p.nombre}')">
                        <span class="badge-category">${p.categoria}</span>
                        <img src="${p.imagen}" alt="${p.nombre}">
                    </div>
                    <div class="product-card-body">
                        <div>
                            <div class="product-band">${p.banda}</div>
                            <h3>${p.nombre}</h3>
                            <p class="product-desc">${p.descripcion}</p>
                        </div>
                        <div class="product-footer">
                            <div class="product-price">${p.precio}</div>
                            <a class="btn-order" href="${whatsappUrl}" target="_blank" rel="noopener noreferrer">
                                💬 Pedir por WhatsApp
                            </a>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // Filtrar por categoría y texto
        function filterProducts() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const filtered = productsData.filter(item => {
                const matchesCategory = activeCategory === 'todos' || item.categoria === activeCategory;
                const matchesSearch = item.nombre.toLowerCase().includes(searchTerm) || 
                                      item.banda.toLowerCase().includes(searchTerm) ||
                                      item.descripcion.toLowerCase().includes(searchTerm);
                return matchesCategory && matchesSearch;
            });
            renderProducts(filtered);
        }

        function setCategory(category, buttonElement) {
            activeCategory = category;
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            buttonElement.classList.add('active');
            filterProducts();
        }

        // Lightbox modal
        const modal = document.getElementById('lightboxModal');
        const modalImg = document.getElementById('lightboxImg');
        const captionText = document.getElementById('lightboxCaption');
        const closeBtn = document.getElementById('lightboxClose');

        function openLightbox(src, alt) {
            modal.classList.add('active');
            modalImg.src = src;
            captionText.textContent = alt;
            document.body.style.overflow = 'hidden';
        }

        const closeModal = () => {
            modal.classList.remove('active');
            document.body.style.overflow = 'auto';
        };

        closeBtn.addEventListener('click', closeModal);
        modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });
        document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && modal.classList.contains('active')) closeModal(); });

        // Carga inicial
        renderProducts(productsData);
    </script>
